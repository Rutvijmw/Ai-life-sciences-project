name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Option 1: generate synthetic data + run pipeline
      - name: Run pipeline (generate data)
        run: |
          python -m scripts.generate_data
          python -m scripts.train_survival
          python -m scripts.run_bayesian
          python -m scripts.build_kg

      # Run tests with project root on path
      - name: Run tests
        run: PYTHONPATH=. pytest -q
